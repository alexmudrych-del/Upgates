<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upgates Manager</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #1a1d23; color: #e4e6eb; }
    .app-header { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; padding: 1rem 1.5rem; background: #25282e; border-bottom: 1px solid #3e4248; }
    .app-title { font-size: 1.25rem; font-weight: 600; margin: 0; }
    .nav-menu { display: flex; gap: 0.25rem; }
    .nav-link { padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; color: #9ca3af; font-weight: 500; transition: color 0.15s, background 0.15s; }
    .nav-link:hover { color: #e4e6eb; background: #3e4248; }
    .nav-link.active { color: #fff; background: #2d6a4f; }
    .main-content { padding: 1rem 1.5rem; }
    .page { display: none; }
    .page.active { display: block; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .toolbar { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-bottom: 1rem; }
    .filter-wrap { display: flex; align-items: center; gap: 0.5rem; }
    input[type="text"], input[type="date"], input[type="number"] { padding: 0.5rem 0.75rem; border: 1px solid #3e4248; border-radius: 6px; background: #25282e; color: #e4e6eb; }
    input[type="text"] { min-width: 220px; }
    input[type="number"] { min-width: 100px; }
    .filter-wrap select { padding: 0.5rem 0.75rem; border: 1px solid #3e4248; border-radius: 6px; background: #25282e; color: #e4e6eb; }
    button { padding: 0.5rem 0.75rem; border-radius: 6px; border: none; cursor: pointer; font-weight: 500; }
    .btn-refresh { background: #2d6a4f; color: #fff; }
    .btn-refresh:hover { background: #40916c; }
    .btn-export { background: #1e3a5f; color: #90caf9; font-size: 0.875rem; padding: 0.35rem 0.6rem; }
    .btn-export:hover { background: #2c5282; }
    .btn-import { background: #5c3d1e; color: #ffcc80; font-size: 0.875rem; padding: 0.35rem 0.6rem; position: relative; }
    .btn-import:hover { background: #7a5c2e; }
    .btn-import input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
    .status { font-size: 0.875rem; color: #9ca3af; }
    .error { color: #f87171; }
    .success { color: #86efac; }
    table { width: 100%; border-collapse: collapse; background: #25282e; border-radius: 8px; overflow: hidden; }
    th, td { padding: 0.6rem 0.75rem; text-align: left; border-bottom: 1px solid #3e4248; }
    th { background: #2d3139; font-weight: 600; }
    tr:hover { background: #2d3139; }
    .code { font-family: ui-monospace, monospace; font-weight: 500; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    #loading { margin: 1rem 0; color: #9ca3af; }
    .pagination { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .pagination-top { margin-bottom: 0.75rem; }
    .pagination-bottom { margin-top: 1rem; }
    .pagination button { background: #3e4248; color: #e4e6eb; padding: 0.4rem 0.75rem; }
    .pagination button:hover:not(:disabled) { background: #4b5563; }
    .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
    .pagination .page-info { font-size: 0.875rem; color: #9ca3af; }
    .pagination .limit-wrap { display: flex; align-items: center; gap: 0.35rem; }
    .pagination select { padding: 0.35rem 0.5rem; border-radius: 6px; background: #25282e; color: #e4e6eb; border: 1px solid #3e4248; }
    .page-placeholder { padding: 2rem; background: #25282e; border-radius: 8px; color: #9ca3af; text-align: center; }
    .page-placeholder h2 { color: #e4e6eb; margin-top: 0; }
  </style>
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">Upgates Manager</h1>
    <nav class="nav-menu">
      <a href="#products" class="nav-link active" data-page="products">Produkty</a>
      <a href="#pages" class="nav-link" data-page="pages">Stránky</a>
    </nav>
  </header>

  <main class="main-content">
    <!-- Stránka Produkty -->
    <div id="page-products" class="page active">
      <h1>Produkty</h1>
      <div class="toolbar">
        <div class="filter-wrap">
          <label for="filterCodes">Kódy (codes):</label>
          <input type="text" id="filterCodes" placeholder="PS600; PS601 nebo PS600, PS601">
        </div>
        <button type="button" class="btn-refresh" id="refresh">Načíst produkty</button>
        <span class="status" id="status"></span>
      </div>
      <div id="loading" style="display:none;">Načítám…</div>
      <div class="pagination pagination-top" id="paginationTop" style="display:none;">
        <button type="button" class="btn-prev">← Předchozí</button>
        <span class="page-info"></span>
        <button type="button" class="btn-next">Další (stránka <span class="next-page-num">2</span>)</button>
        <div class="limit-wrap">
          <label>Na stránku:</label>
          <select class="limit-select">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="5000" selected>5000</option>
          </select>
        </div>
      </div>
      <table id="table" style="display:none;">
        <thead>
          <tr>
            <th>Kód</th>
            <th>Název / Title</th>
            <th>ID</th>
            <th>Akce</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <p id="empty" style="display:none; color: #9ca3af;">Žádné produkty nebo nic nevyhovuje filtru.</p>
      <div class="pagination pagination-bottom" id="paginationBottom" style="display:none;">
        <button type="button" class="btn-prev">← Předchozí</button>
        <span class="page-info"></span>
        <button type="button" class="btn-next">Další (stránka <span class="next-page-num">2</span>)</button>
        <div class="limit-wrap">
          <label>Na stránku:</label>
          <select class="limit-select">
            <option value="10">10</option>
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="5000" selected>5000</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Stránka Stránky (Pages) – kategorie obsahují stránky -->
    <div id="page-pages" class="page">
      <h1>Stránky (Kategorie)</h1>
      <div class="toolbar">
        <div class="filter-wrap">
          <label for="filterCatCodes">Kódy:</label>
          <input type="text" id="filterCatCodes" placeholder="KAT1; KAT2 nebo KAT1, KAT2">
        </div>
        <div class="filter-wrap">
          <label for="filterCategoryId">Category ID:</label>
          <input type="number" id="filterCategoryId" placeholder="ID kategorie" min="0">
        </div>
        <div class="filter-wrap">
          <label for="filterParentId">Parent ID:</label>
          <input type="number" id="filterParentId" placeholder="ID nadřazené" min="0">
        </div>
        <div class="filter-wrap">
          <label for="filterActive">Aktivní:</label>
          <select id="filterActive">
            <option value="">Vše</option>
            <option value="true">Ano</option>
            <option value="false">Ne</option>
          </select>
        </div>
        <div class="filter-wrap">
          <label for="filterLanguage">Jazyk:</label>
          <select id="filterLanguage">
            <option value="">Vše</option>
            <option value="cs">cs</option>
            <option value="en">en</option>
            <option value="sk">sk</option>
          </select>
        </div>
        <div class="filter-wrap">
          <label for="filterCreatedFrom">Vytvořeno od:</label>
          <input type="date" id="filterCreatedFrom">
        </div>
        <div class="filter-wrap">
          <label for="filterUpdatedFrom">Změněno od:</label>
          <input type="date" id="filterUpdatedFrom">
        </div>
        <button type="button" class="btn-refresh" id="refreshCategories">Načíst kategorie</button>
        <span class="status" id="statusCategories"></span>
      </div>
      <div id="apiLinkCategories" style="display:none; color:#9ca3af; font-size:0.8rem; margin-bottom:0.5rem; word-break:break-all;"></div>
      <div id="loadingCategories" style="display:none;">Načítám…</div>
      <div class="pagination pagination-top" id="paginationCategoriesTop" style="display:none;">
        <button type="button" class="btn-prev-cat">← Předchozí</button>
        <span class="page-info"></span>
        <button type="button" class="btn-next-cat">Další (stránka <span class="next-page-num">2</span>)</button>
        <div class="limit-wrap">
          <label>Na stránku:</label>
          <select class="limit-select-cat">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="5000">5000</option>
          </select>
        </div>
      </div>
      <table id="tableCategories" style="display:none;">
        <thead>
          <tr>
            <th>ID</th>
            <th>Název / Title</th>
            <th>URL</th>
            <th>Akce</th>
          </tr>
        </thead>
        <tbody id="tbodyCategories"></tbody>
      </table>
      <p id="emptyCategories" style="display:none; color: #9ca3af;">Žádné kategorie.</p>
      <div class="pagination pagination-bottom" id="paginationCategoriesBottom" style="display:none;">
        <button type="button" class="btn-prev-cat">← Předchozí</button>
        <span class="page-info"></span>
        <button type="button" class="btn-next-cat">Další (stránka <span class="next-page-num">2</span>)</button>
        <div class="limit-wrap">
          <label>Na stránku:</label>
          <select class="limit-select-cat">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="5000">5000</option>
          </select>
        </div>
      </div>
    </div>
  </main>

  <script>
    // === Navigace ===
    function getCurrentPage() {
      const hash = (window.location.hash || '#products').slice(1);
      return hash === 'pages' ? 'pages' : 'products';
    }

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
      const pageEl = document.getElementById('page-' + pageId);
      const navEl = document.querySelector('.nav-link[data-page="' + pageId + '"]');
      if (pageEl) pageEl.classList.add('active');
      if (navEl) navEl.classList.add('active');
    }

    function handleNavigation() {
      const page = getCurrentPage();
      showPage(page);
      if (page === 'pages') loadCategories(1);
    }

    window.addEventListener('hashchange', handleNavigation);
    window.addEventListener('load', handleNavigation);

    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const page = link.getAttribute('data-page');
        window.location.hash = page;
      });
    });

    // === Produkty (existující logika) ===
    const filterCodesEl = document.getElementById('filterCodes');
    const refreshBtn = document.getElementById('refresh');
    const statusEl = document.getElementById('status');
    const loadingEl = document.getElementById('loading');
    const tableEl = document.getElementById('table');
    const tbody = document.getElementById('tbody');
    const emptyEl = document.getElementById('empty');
    const paginationTopEl = document.getElementById('paginationTop');
    const paginationBottomEl = document.getElementById('paginationBottom');
    const limitSelects = document.querySelectorAll('.limit-select');

    let currentPage = 1;

    function setStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + type;
    }

    function getTitle(p) {
      const d = (p.descriptions || [])[0];
      return (d && d.title) || p.code || '—';
    }

    function renderRows(list) {
      tbody.innerHTML = '';
      if (!list.length) {
        tableEl.style.display = 'none';
        emptyEl.style.display = 'block';
        paginationTopEl.style.display = 'none';
        paginationBottomEl.style.display = 'none';
        return;
      }
      tableEl.style.display = 'table';
      emptyEl.style.display = 'none';
      paginationTopEl.style.display = 'flex';
      paginationBottomEl.style.display = 'flex';
      list.forEach(p => {
        const id = (p.product_id != null ? p.product_id : (p.id != null ? p.id : '—'));
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="code">${escapeHtml(p.code || '—')}</td>
          <td>${escapeHtml(getTitle(p))}</td>
          <td>${escapeHtml(String(id))}</td>
          <td>
            <div class="actions">
              <button type="button" class="btn-export" data-code="${escapeHtml(p.code)}">Export JSON</button>
              <span class="btn-import">
                <button type="button">Import JSON</button>
                <input type="file" accept=".json" data-id="${id}" data-code="${escapeHtml(p.code)}">
              </span>
            </div>
          </td>
        `;
        tr.querySelector('.btn-export').addEventListener('click', () => exportProduct(p.code));
        tr.querySelector('input[type="file"]').addEventListener('change', (e) => importProduct(e, id));
        tbody.appendChild(tr);
      });
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    function updatePagination(data) {
      const page = (data && data.page != null) ? Number(data.page) : 1;
      const total = (data && data.total != null) ? Number(data.total) : 0;
      currentPage = page;
      document.querySelectorAll('#page-products .page-info').forEach(el => {
        el.textContent = `Stránka ${page}${total ? ` (celkem ${total} produktů)` : ''}`;
      });
      document.querySelectorAll('#page-products .btn-prev').forEach(el => { el.disabled = page <= 1; });
      document.querySelectorAll('#page-products .btn-next').forEach(el => { el.disabled = false; });
      document.querySelectorAll('#page-products .next-page-num').forEach(el => { el.textContent = String(page + 1); });
    }

    async function loadProducts(page = 1) {
      loadingEl.style.display = 'block';
      setStatus('');
      const codes = (filterCodesEl.value || '').trim();
      const limitEl = limitSelects[0];
      const limit = parseInt(limitEl.value, 10) || 5000;
      const params = new URLSearchParams({ page: String(page), limit: String(limit) });
      if (codes) params.set('codes', codes);
      params.set('_', String(Date.now()));
      const fetchUrl = window.location.origin + '/api/products?' + params.toString();
      try {
        const r = await fetch(fetchUrl, { cache: 'no-store' });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          const msg = typeof err.error === 'string' ? err.error : ((err.error && err.error.messages) ? err.error.messages.join('; ') : (err.error ? JSON.stringify(err.error) : r.statusText));
          throw new Error(msg || 'Chyba načtení');
        }
        const raw = await r.json();
        const isPaginated = raw && typeof raw.total === 'number' && Array.isArray(raw.items);
        const list = isPaginated ? raw.items : (Array.isArray(raw) ? raw : []);
        const data = isPaginated ? raw : {
          items: list,
          total: list.length,
          page: 1,
          limit: list.length || 20,
          totalPages: 1,
        };
        renderRows(list);
        updatePagination(data);
        const total = Number(data.total) || 0;
        const pageNum = Number(data.page) || 1;
        const limitNum = Number(data.limit) || 20;
        const from = total === 0 ? 0 : (pageNum - 1) * limitNum + 1;
        const to = total === 0 ? 0 : Math.min(from + list.length - 1, total);
        const filterStr = codes ? ` Kódy: ${codes}.` : '';
        const upstream = raw.upstream_url ? ` Voláno: ${raw.upstream_url}` : '';
        const msg = raw.message ? ` ${raw.message}` : '';
        setStatus(`Zobrazeno ${from}–${to} z ${total} produktů.${filterStr}${upstream}${msg}`, 'success');
      } catch (e) {
        const errMsg = typeof e.message === 'string' ? e.message : (e.message ? JSON.stringify(e.message) : 'Chyba');
        setStatus(errMsg, 'error');
        renderRows([]);
        paginationTopEl.style.display = 'none';
        paginationBottomEl.style.display = 'none';
      } finally {
        loadingEl.style.display = 'none';
      }
    }

    async function exportProduct(code) {
      setStatus('Exportuji…');
      try {
        const r = await fetch('/api/products/by-code/' + encodeURIComponent(code));
        if (!r.ok) throw new Error('Produkt nenalezen');
        const product = await r.json();
        const blob = new Blob([JSON.stringify(product, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = (code || 'product') + '.json';
        a.click();
        URL.revokeObjectURL(a.href);
        setStatus(`Export: ${code}.json`, 'success');
      } catch (e) {
        setStatus(e.message || 'Export selhal', 'error');
      }
    }

    async function importProduct(ev, productId) {
      const file = ev.target.files[0];
      if (!file) return;
      setStatus('Nahrávám…');
      try {
        const text = await file.text();
        const body = JSON.parse(text);
        const r = await fetch('/api/products/' + productId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          const msg = typeof err.error === 'string' ? err.error : ((err.error && err.error.messages) ? err.error.messages.join('; ') : (err.error ? JSON.stringify(err.error) : r.statusText));
          throw new Error(msg || 'Chyba nahrání');
        }
        setStatus('Import dokončen. Obnovte seznam.', 'success');
        ev.target.value = '';
      } catch (e) {
        setStatus(typeof e.message === 'string' ? e.message : 'Import selhal', 'error');
        ev.target.value = '';
      }
    }

    refreshBtn.addEventListener('click', () => loadProducts(1));
    filterCodesEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadProducts(1); });

    document.querySelectorAll('#page-products .btn-prev').forEach(btn => {
      btn.addEventListener('click', () => loadProducts(Math.max(1, currentPage - 1)));
    });
    document.querySelectorAll('#page-products .btn-next').forEach(btn => {
      btn.addEventListener('click', () => loadProducts(currentPage + 1));
    });
    limitSelects.forEach(sel => {
      sel.addEventListener('change', () => {
        const v = sel.value;
        limitSelects.forEach(s => { if (s !== sel) s.value = v; });
        loadProducts(1);
      });
    });

    loadProducts(1);

    // === Stránky / Kategorie ===
    const refreshCategoriesBtn = document.getElementById('refreshCategories');
    const statusCategoriesEl = document.getElementById('statusCategories');
    const loadingCategoriesEl = document.getElementById('loadingCategories');
    const tableCategoriesEl = document.getElementById('tableCategories');
    const tbodyCategories = document.getElementById('tbodyCategories');
    const emptyCategoriesEl = document.getElementById('emptyCategories');
    const paginationCategoriesTopEl = document.getElementById('paginationCategoriesTop');
    const paginationCategoriesBottomEl = document.getElementById('paginationCategoriesBottom');
    const limitSelectsCat = document.querySelectorAll('.limit-select-cat');

    let currentPageCat = 1;

    function setStatusCategories(msg, type = '') {
      statusCategoriesEl.textContent = msg;
      statusCategoriesEl.className = 'status ' + type;
    }

    function getCategoryTitle(c) {
      const d = (c.descriptions || [])[0];
      if (d && d.title) return d.title;
      return c.name || c.title || c.seo_url || c.category_id || c.id || '—';
    }

    function getCategoryUrl(c) {
      const d = (c.descriptions || [])[0];
      return (d && d.url) || c.url || '—';
    }

    function renderCategoryRows(list) {
      tbodyCategories.innerHTML = '';
      if (!list.length) {
        tableCategoriesEl.style.display = 'none';
        emptyCategoriesEl.style.display = 'block';
        paginationCategoriesTopEl.style.display = 'none';
        paginationCategoriesBottomEl.style.display = 'none';
        return;
      }
      tableCategoriesEl.style.display = 'table';
      emptyCategoriesEl.style.display = 'none';
      paginationCategoriesTopEl.style.display = 'flex';
      paginationCategoriesBottomEl.style.display = 'flex';
      list.forEach(c => {
        const id = (c.category_id != null ? c.category_id : (c.id != null ? c.id : '—'));
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="code">${escapeHtml(String(id))}</td>
          <td>${escapeHtml(getCategoryTitle(c))}</td>
          <td>${escapeHtml(getCategoryUrl(c))}</td>
          <td>
            <div class="actions">
              <button type="button" class="btn-export" data-id="${escapeHtml(String(id))}">Export JSON</button>
              <span class="btn-import">
                <button type="button">Import JSON</button>
                <input type="file" accept=".json" data-id="${escapeHtml(String(id))}">
              </span>
            </div>
          </td>
        `;
        tr.querySelector('.btn-export').addEventListener('click', function() { exportCategory(id); });
        tr.querySelector('input[type="file"]').addEventListener('change', function(e) { importCategory(e, id); });
        tbodyCategories.appendChild(tr);
      });
    }

    function updateCategoriesPagination(data) {
      const page = (data && data.page != null) ? Number(data.page) : 1;
      const total = (data && data.total != null) ? Number(data.total) : 0;
      currentPageCat = page;
      document.querySelectorAll('#page-pages .page-info').forEach(el => { el.textContent = `Stránka ${page}${total ? ` (celkem ${total} kategorií)` : ''}`; });
      document.querySelectorAll('.btn-prev-cat').forEach(el => { el.disabled = page <= 1; });
      document.querySelectorAll('.btn-next-cat').forEach(el => { el.disabled = false; });
      document.querySelectorAll('#page-pages .next-page-num').forEach(el => { el.textContent = String(page + 1); });
    }

    async function loadCategories(page = 1) {
      loadingCategoriesEl.style.display = 'block';
      setStatusCategories('');
      const limitEl = limitSelectsCat[0];
      const limit = parseInt(limitEl.value, 10) || 20;
      const params = new URLSearchParams({ page: String(page), limit: String(limit), _: String(Date.now()) });
      const codes = document.getElementById('filterCatCodes').value.trim();
      if (codes) params.set('codes', codes);
      const categoryId = document.getElementById('filterCategoryId').value.trim();
      if (categoryId) params.set('category_id', categoryId);
      const parentId = document.getElementById('filterParentId').value.trim();
      if (parentId) params.set('parent_id', parentId);
      const active = document.getElementById('filterActive').value;
      if (active) params.set('active_yn', active);
      const lang = document.getElementById('filterLanguage').value.trim();
      if (lang) params.set('language', lang);
      const createdFrom = document.getElementById('filterCreatedFrom').value;
      if (createdFrom) params.set('creation_time_from', createdFrom);
      const updatedFrom = document.getElementById('filterUpdatedFrom').value;
      if (updatedFrom) params.set('last_update_time_from', updatedFrom);
      try {
        const r = await fetch(window.location.origin + '/api/categories?' + params.toString(), { cache: 'no-store' });
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          const msg = typeof err.error === 'string' ? err.error : ((err.error && err.error.messages) ? err.error.messages.join('; ') : (err.error ? JSON.stringify(err.error) : r.statusText));
          throw new Error(msg || 'Chyba načtení');
        }
        const raw = await r.json();
        const isPaginated = raw && typeof raw.total === 'number' && Array.isArray(raw.items);
        const list = isPaginated ? raw.items : (Array.isArray(raw) ? raw : []);
        const data = isPaginated ? raw : { items: list, total: list.length, page: 1, limit: list.length || 20, totalPages: 1 };
        renderCategoryRows(list);
        updateCategoriesPagination(data);
        const total = Number(data.total) || 0;
        const pageNum = Number(data.page) || 1;
        const limitNum = Number(data.limit) || 20;
        const from = total === 0 ? 0 : (pageNum - 1) * limitNum + 1;
        const to = total === 0 ? 0 : Math.min(from + list.length - 1, total);
        const upstream = raw.upstream_url ? raw.upstream_url : '';
        const apiLinkEl = document.getElementById('apiLinkCategories');
        if (upstream) {
          apiLinkEl.style.display = 'block';
          apiLinkEl.innerHTML = 'API: <a href="' + upstream.replace(/"/g, '&quot;') + '" target="_blank" rel="noopener" style="color:#90caf9;">' + escapeHtml(upstream) + '</a>';
        } else {
          apiLinkEl.style.display = 'none';
        }
        setStatusCategories('Zobrazeno ' + from + '–' + to + ' z ' + total + ' kategorií.', 'success');
      } catch (e) {
        const errMsg = typeof e.message === 'string' ? e.message : (e.message ? JSON.stringify(e.message) : 'Chyba');
        setStatusCategories(errMsg, 'error');
        renderCategoryRows([]);
        paginationCategoriesTopEl.style.display = 'none';
        paginationCategoriesBottomEl.style.display = 'none';
      } finally {
        loadingCategoriesEl.style.display = 'none';
      }
    }

    async function exportCategory(categoryId) {
      setStatusCategories('Exportuji…');
      try {
        const r = await fetch('/api/categories?category_id=' + encodeURIComponent(categoryId));
        if (!r.ok) throw new Error('Kategorie nenalezena');
        const data = await r.json();
        const category = (data.items && data.items[0]) ? data.items[0] : null;
        if (!category) throw new Error('Kategorie nenalezena');
        const blob = new Blob([JSON.stringify(category, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'category-' + categoryId + '.json';
        a.click();
        URL.revokeObjectURL(a.href);
        setStatusCategories('Export: category-' + categoryId + '.json', 'success');
      } catch (e) {
        setStatusCategories(e.message || 'Export selhal', 'error');
      }
    }

    async function importCategory(ev, categoryId) {
      const file = ev.target.files[0];
      if (!file) return;
      setStatusCategories('Nahrávám…');
      try {
        const text = await file.text();
        const body = JSON.parse(text);
        const r = await fetch('/api/categories/' + categoryId, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!r.ok) {
          const err = await r.json().catch(function() { return {}; });
          const msg = typeof err.error === 'string' ? err.error : ((err.error && err.error.messages) ? err.error.messages.join('; ') : (err.error ? JSON.stringify(err.error) : r.statusText));
          throw new Error(msg || 'Chyba nahrání');
        }
        setStatusCategories('Import dokončen. Obnovte seznam.', 'success');
        ev.target.value = '';
      } catch (e) {
        setStatusCategories(typeof e.message === 'string' ? e.message : 'Import selhal', 'error');
        ev.target.value = '';
      }
    }

    refreshCategoriesBtn.addEventListener('click', function() { loadCategories(1); });
    document.querySelectorAll('#page-pages .filter-wrap input, #page-pages .filter-wrap select').forEach(el => {
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadCategories(1); });
    });
    document.querySelectorAll('.btn-prev-cat').forEach(btn => {
      btn.addEventListener('click', () => loadCategories(Math.max(1, currentPageCat - 1)));
    });
    document.querySelectorAll('.btn-next-cat').forEach(btn => {
      btn.addEventListener('click', () => loadCategories(currentPageCat + 1));
    });
    limitSelectsCat.forEach(sel => {
      sel.addEventListener('change', () => {
        const v = sel.value;
        limitSelectsCat.forEach(s => { if (s !== sel) s.value = v; });
        loadCategories(1);
      });
    });
  </script>
</body>
</html>
